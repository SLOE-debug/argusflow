[package]
name = "argusflow-windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
autotests = false

[[test]]
name = "native"
path = "../../tests/argusflow-windows/integration/native.rs"

[[example]]
name = "test_window"
path = "../../tests/argusflow-windows/support/test_window.rs"

[dependencies]
argusflow-core.workspace = true
tokio.workspace = true
tracing.workspace = true
thiserror.workspace = true
windows = { workspace = true, features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Threading", "Win32_System_Variant", "Win32_Security", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_Graphics_Gdi"] }

[lints]
workspace = true
[dev-dependencies]
windows = { workspace = true, features = ["Win32_System_LibraryLoader", "Win32_UI_Controls"] }
