[package]
name = "argusflow-windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
autotests = false

[[test]]
name = "native"
path = "../../tests/argusflow-windows/integration/native.rs"

[[example]]
name = "test_window"
path = "../../tests/argusflow-windows/support/test_window.rs"

[[test]]
name = "capture"
path = "../../tests/argusflow-windows/integration/capture.rs"

[[example]]
name = "sample_ocr"
path = "../../tests/argusflow-windows/support/sample_ocr.rs"

[dependencies]
argusflow-aql.workspace = true
argusflow-core.workspace = true
argusflow-capture-contracts.workspace = true
tokio.workspace = true
tracing.workspace = true
thiserror.workspace = true
windows = { workspace = true, features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Variant", "Win32_Security", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_Graphics_Gdi", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D_Fxc", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_Performance", "Win32_System_StationsAndDesktops"] }

[lints]
workspace = true
[dev-dependencies]
argusflow-capture.workspace = true
argusflow-vision.workspace = true
windows = { workspace = true, features = ["Win32_System_LibraryLoader", "Win32_UI_Controls"] }
