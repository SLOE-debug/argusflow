[package]
name = "argusflow-recorder"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
argusflow-capture.workspace = true
argusflow-core.workspace = true
png = "0.18.1"
async-trait.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true

[dev-dependencies]
argusflow-windows.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation", "Win32_System_Threading", "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_System_SystemInformation",
    "Win32_UI_Accessibility", "Win32_System_DataExchange", "Win32_System_Memory",
    "Win32_Graphics_Gdi",
    "Win32_Security",
] }
