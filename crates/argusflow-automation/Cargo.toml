[package]
name = "argusflow-automation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
autotests = false

[dependencies]
argusflow-core.workspace = true
argusflow-aql.workspace = true
argusflow-browser = { path = "../argusflow-browser" }
tokio.workspace = true

[target.'cfg(windows)'.dependencies]
argusflow-windows = { path = "../argusflow-windows" }
argusflow-vision.workspace = true
argusflow-capture-contracts.workspace = true

[lints]
workspace = true

[[test]]
name = "native"
path = "../../tests/argusflow-automation/integration/native.rs"

[target.'cfg(windows)'.dev-dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi"] }

[[example]]
name = "aql_browser"
path = "../../tests/argusflow-automation/support/browser.rs"
