[workspace]
members = [
    "crates/argusflow-agent",
    "crates/argusflow-browser",
    "crates/argusflow-core",
    "crates/argusflow-query",
    "crates/argusflow-query-wasm",
    "crates/argusflow-runtime",
    "crates/argusflow-vision",
    "crates/argusflow-windows",
    "src-tauri",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"

[workspace.metadata.argusflow]
supported-target = "x86_64-pc-windows-msvc"
language-service-target = "wasm32-unknown-unknown"
platform-policy = "windows-only"

[workspace.dependencies]
argusflow-agent = { path = "crates/argusflow-agent" }
argusflow-browser = { path = "crates/argusflow-browser" }
argusflow-core = { path = "crates/argusflow-core" }
argusflow-query = { path = "crates/argusflow-query" }
argusflow-runtime = { path = "crates/argusflow-runtime" }
argusflow-vision = { path = "crates/argusflow-vision" }
argusflow-windows = { path = "crates/argusflow-windows" }
async-trait = "0.1.89"
futures-util = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
regex = "1.12.2"
rhai = { version = "1.25.1", features = ["serde", "sync", "no_module"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time", "test-util"] }
tokio-tungstenite = { version = "0.28.0", default-features = false, features = ["connect", "handshake"] }
uuid = { version = "1.24.1", features = ["serde", "v4"] }
wasm-bindgen = "=0.2.127"
serde-wasm-bindgen = "0.6.5"
windows = "0.62.2"
