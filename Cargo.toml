[workspace]
members = ["crates/argusflow-core", "crates/argusflow-windows", "crates/argusflow-browser", "crates/argusflow-vision", "crates/argusflow-capture-contracts", "crates/argusflow-capture"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"

[workspace.dependencies]
argusflow-core = { path = "crates/argusflow-core" }
argusflow-capture-contracts = { path = "crates/argusflow-capture-contracts" }
argusflow-capture = { path = "crates/argusflow-capture" }
argusflow-vision = { path = "crates/argusflow-vision" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "process", "fs", "test-util"] }
tracing = "0.1"
windows = "0.62.2"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.dev.package.argusflow-vision]
opt-level = 2

[profile.dev.package.image]
opt-level = 2

[profile.dev.package.imageproc]
opt-level = 2
