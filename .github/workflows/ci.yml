name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust-tests:
    name: Rust compiler and runtime tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.91"
      - name: Run workspace tests
        run: cargo test --workspace
