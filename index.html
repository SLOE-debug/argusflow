<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8fafc" />
    <title>ArgusFlow</title>
    <!-- 这段样式必须内联：主窗口显示时不能等待 Vite、React 或 Tailwind。 -->
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      #argusflow-boot-loading {
        position: relative;
        isolation: isolate;
        display: grid;
        width: 100%;
        height: 100%;
        grid-template-rows: 40px minmax(0, 1fr);
        overflow: hidden;
        background: radial-gradient(circle at 50% 28%, #eff6ff 0%, #f8fafc 42%, #eef2f7 100%);
        color: #1e293b;
        font-family: Inter, "Segoe UI", system-ui, sans-serif;
      }

      #argusflow-boot-loading::before,
      #argusflow-boot-loading::after {
        position: absolute;
        z-index: -1;
        width: 320px;
        height: 320px;
        border-radius: 999px;
        content: "";
        filter: blur(64px);
        animation: argusflow-boot-breathe 5s ease-in-out infinite;
      }

      #argusflow-boot-loading::before {
        top: 96px;
        left: -96px;
        background: rgb(191 219 254 / 28%);
      }

      #argusflow-boot-loading::after {
        right: -80px;
        bottom: -128px;
        width: 384px;
        height: 384px;
        background: rgb(165 243 252 / 22%);
        animation-delay: -2s;
      }

      #argusflow-boot-loading header {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        border-bottom: 1px solid rgb(255 255 255 / 80%);
        background: rgb(255 255 255 / 76%);
        padding: 0 16px;
        font-size: 12px;
        font-weight: 600;
        color: #334155;
        box-shadow: 0 1px 0 rgb(148 163 184 / 14%);
        backdrop-filter: blur(20px);
      }

      .argusflow-boot-live-dot {
        position: relative;
        display: inline-flex;
        width: 8px;
        height: 8px;
        margin-right: 8px;
        border-radius: 999px;
        background: #2563eb;
      }

      .argusflow-boot-live-dot::after {
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: #3b82f6;
        content: "";
        animation: argusflow-boot-ping 1.5s ease-out infinite;
      }

      .argusflow-boot-context {
        margin-left: 8px;
        padding-left: 8px;
        border-left: 1px solid #e2e8f0;
        color: #94a3b8;
        font-weight: 400;
      }

      #argusflow-boot-loading section {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 24px;
      }

      .argusflow-boot-card {
        box-sizing: border-box;
        width: min(100%, 672px);
        border: 1px solid rgb(255 255 255 / 90%);
        border-radius: 28px;
        background: rgb(255 255 255 / 76%);
        padding: 36px;
        box-shadow: 0 28px 80px rgb(51 65 85 / 14%), 0 4px 18px rgb(37 99 235 / 6%);
        backdrop-filter: blur(20px);
      }

      .argusflow-boot-heading {
        display: grid;
        align-items: center;
        grid-template-columns: 176px minmax(0, 1fr);
        gap: 28px;
      }

      .argusflow-boot-orbit {
        position: relative;
        display: flex;
        width: 160px;
        height: 160px;
        align-items: center;
        justify-content: center;
      }

      .argusflow-boot-orbit::before {
        position: absolute;
        inset: 16px;
        border-radius: 999px;
        background: rgb(147 197 253 / 22%);
        content: "";
        filter: blur(20px);
        animation: argusflow-boot-breathe 2.4s ease-in-out infinite;
      }

      .argusflow-boot-ring {
        position: absolute;
        inset: 4px;
        border: 1px dashed rgb(147 197 253 / 70%);
        border-radius: 999px;
        animation: argusflow-boot-spin 14s linear infinite;
      }

      .argusflow-boot-ring-inner {
        position: absolute;
        inset: 20px;
        border: 1px solid rgb(191 219 254 / 80%);
        border-radius: 999px;
        animation: argusflow-boot-spin 9s linear infinite reverse;
      }

      .argusflow-boot-ring-inner::before {
        position: absolute;
        top: -4px;
        left: calc(50% - 4px);
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: #3b82f6;
        box-shadow: 0 0 12px rgb(59 130 246 / 80%);
        content: "";
      }

      .argusflow-boot-core {
        position: relative;
        display: flex;
        width: 72px;
        height: 72px;
        align-items: center;
        justify-content: center;
        border: 1px solid rgb(255 255 255 / 90%);
        border-radius: 22px;
        background: rgb(255 255 255 / 92%);
        color: #2563eb;
        box-shadow: 0 18px 48px rgb(37 99 235 / 20%);
      }

      .argusflow-boot-core::before {
        position: absolute;
        inset: 8px;
        border-radius: 16px;
        background: rgb(219 234 254 / 72%);
        content: "";
        animation: argusflow-boot-ping 2.4s ease-out infinite;
      }

      .argusflow-boot-core svg {
        position: relative;
        width: 30px;
        height: 30px;
      }

      .argusflow-boot-node {
        position: absolute;
        display: flex;
        width: 40px;
        height: 40px;
        align-items: center;
        justify-content: center;
        border: 1px solid #bfdbfe;
        border-radius: 12px;
        background: rgb(239 246 255 / 96%);
        color: #2563eb;
        box-shadow: 0 8px 18px rgb(191 219 254 / 70%);
      }

      .argusflow-boot-node::before {
        position: absolute;
        inset: 5px;
        border-radius: 8px;
        background: rgb(147 197 253 / 45%);
        content: "";
        animation: argusflow-boot-ping 1.8s ease-out infinite;
      }

      .argusflow-boot-node svg {
        position: relative;
        width: 17px;
        height: 17px;
        animation: argusflow-boot-breathe 1.6s ease-in-out infinite;
      }

      .argusflow-boot-node-capture {
        top: 26px;
        left: 0;
      }

      .argusflow-boot-node-small {
        top: 26px;
        right: 0;
        animation-delay: -0.6s;
      }

      .argusflow-boot-node-medium {
        bottom: 0;
        left: calc(50% - 20px);
        animation-delay: -1.2s;
      }

      .argusflow-boot-badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
        border: 1px solid #dbeafe;
        border-radius: 999px;
        background: rgb(239 246 255 / 82%);
        padding: 5px 12px;
        color: #1d4ed8;
        font-size: 11px;
        font-weight: 500;
      }

      .argusflow-boot-spinner {
        width: 12px;
        height: 12px;
        border: 2px solid #bfdbfe;
        border-top-color: #2563eb;
        border-radius: 999px;
        animation: argusflow-boot-spin 0.8s linear infinite;
      }

      .argusflow-boot-title {
        margin: 0;
        font-size: 24px;
        font-weight: 600;
        letter-spacing: -0.025em;
        color: #0f172a;
      }

      .argusflow-boot-detail {
        margin: 8px 0 0;
        font-size: 14px;
        line-height: 24px;
        color: #64748b;
      }

      .argusflow-boot-progress {
        display: grid;
        height: 6px;
        margin-top: 28px;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }

      .argusflow-boot-progress span {
        position: relative;
        overflow: hidden;
        height: 100%;
        border-radius: 999px;
        background: #dbeafe;
      }

      .argusflow-boot-progress span::after {
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: linear-gradient(90deg, transparent, #38bdf8, #3b82f6, transparent);
        content: "";
        transform: translateX(-100%);
        animation: argusflow-boot-travel 1.5s ease-in-out infinite;
      }

      .argusflow-boot-progress span:nth-child(2)::after {
        animation-delay: -0.5s;
      }

      .argusflow-boot-progress span:nth-child(3)::after {
        animation-delay: -1s;
      }

      @keyframes argusflow-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes argusflow-boot-travel {
        to {
          transform: translateX(100%);
        }
      }

      @keyframes argusflow-boot-ping {
        75%,
        100% {
          opacity: 0;
          transform: scale(1.6);
        }
      }

      @keyframes argusflow-boot-breathe {
        0%,
        100% {
          opacity: 0.55;
          transform: scale(0.96);
        }

        50% {
          opacity: 1;
          transform: scale(1.04);
        }
      }

      @media (max-width: 620px) {
        .argusflow-boot-card {
          padding: 28px;
        }

        .argusflow-boot-heading {
          grid-template-columns: 1fr;
          justify-items: center;
          text-align: center;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #argusflow-boot-loading::before,
        #argusflow-boot-loading::after,
        .argusflow-boot-live-dot::after,
        .argusflow-boot-orbit::before,
        .argusflow-boot-ring,
        .argusflow-boot-ring-inner,
        .argusflow-boot-core::before,
        .argusflow-boot-node::before,
        .argusflow-boot-node svg,
        .argusflow-boot-spinner,
        .argusflow-boot-progress span::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main
        id="argusflow-boot-loading"
        role="status"
        aria-live="polite"
        aria-label="ArgusFlow 正在启动"
      >
        <header data-tauri-drag-region>
          <span class="argusflow-boot-live-dot" aria-hidden="true"></span>
          ArgusFlow Studio
          <span class="argusflow-boot-context">本地运行环境</span>
        </header>
        <section>
          <div class="argusflow-boot-card">
            <div class="argusflow-boot-heading">
              <div class="argusflow-boot-orbit" aria-hidden="true">
                <span class="argusflow-boot-ring"></span>
                <span class="argusflow-boot-ring-inner"></span>
                <span class="argusflow-boot-core">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <rect width="6" height="6" x="3" y="3" rx="1"></rect>
                    <path d="M6 9v3a3 3 0 0 0 3 3h3"></path>
                    <rect width="6" height="6" x="15" y="15" rx="1"></rect>
                    <path d="M15 6h3a3 3 0 0 1 3 3v3"></path>
                  </svg>
                </span>
                <span class="argusflow-boot-node argusflow-boot-node-capture">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect width="18" height="12" x="3" y="4" rx="2"></rect>
                    <path d="M8 20h8M12 16v4"></path>
                  </svg>
                </span>
                <span class="argusflow-boot-node argusflow-boot-node-small">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 8h8M7 12h10M7 16h6"></path>
                  </svg>
                </span>
                <span class="argusflow-boot-node argusflow-boot-node-medium">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="7" y="7" width="10" height="10" rx="2"></rect>
                    <path d="M9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 14h3M1 9h3M1 14h3"></path>
                  </svg>
                </span>
              </div>
              <div>
                <span class="argusflow-boot-badge">
                  <span class="argusflow-boot-spinner" aria-hidden="true"></span>
                  三项能力并行准备中
                </span>
                <h1 class="argusflow-boot-title">正在启动 ArgusFlow</h1>
                <p class="argusflow-boot-detail">
                  正在同时准备屏幕捕获、快速 OCR 和精确 OCR。
                </p>
              </div>
            </div>
            <div
              class="argusflow-boot-progress"
              aria-hidden="true"
            >
              <span></span>
              <span></span>
              <span></span>
            </div>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
